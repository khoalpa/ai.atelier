<!doctype html><html lang="vi"><meta charset="utf-8"><title>Kiểm chứng bộ chỉnh ảnh thủ công</title><style>body{font:15px system-ui;background:#111923;color:#e6edf4;padding:24px}button{padding:12px}pre{white-space:pre-wrap}</style><h1>Kiểm chứng bộ chỉnh ảnh thủ công</h1><button id="run">Chạy kiểm chứng</button><pre id="report">Sẵn sàng.</pre><script src="/manual-core.js"></script><script>
const C=ManualCore,source={url:'/manual-assets/cb8673974b634c303f15af577c7bfedc7c8a89bc0d1e592ce5a8eb1727f14c38.png',width:128,height:96,name:'fixture'},logo='/manual-assets/2cc3d82ee430f7646a14924bfd95d7c2c751c3904fc9cf481fde7e3d4673590d.png';
const worker=new Worker('/manual-worker.js'),jobs=new Map();let seq=0;
worker.onmessage=({data})=>{const job=jobs.get(data.id);jobs.delete(data.id);data.error?job.reject(Error(data.error)):job.resolve(data);};
function call(document,action='preview',extra={}){const id=++seq;return new Promise((resolve,reject)=>{jobs.set(id,{resolve,reject});worker.postMessage({id,document,action,...extra});});}
async function render(doc,extra={}){const {bitmap}=await call(doc,'preview',extra);const canvas=new OffscreenCanvas(bitmap.width,bitmap.height),ctx=canvas.getContext('2d');ctx.drawImage(bitmap,0,0);bitmap.close();return {w:canvas.width,h:canvas.height,data:ctx.getImageData(0,0,canvas.width,canvas.height).data};}
const pixel=(im,x,y)=>Array.from(im.data.slice((y*im.w+x)*4,(y*im.w+x)*4+4)),eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b),assert=(v,message)=>{if(!v)throw Error(message);};
const stroke=(tool,extra={})=>({tool,points:[{x:48,y:48}],size:24,softness:0,opacity:1,color:'#ff0000',selection:null,...extra});
document.getElementById('run').onclick=async()=>{
 const report={startedAt:new Date().toISOString(),checks:[]};const start=performance.now();document.getElementById('run').disabled=true;
 async function check(name,fn){const began=performance.now();try{await fn();report.checks.push({name,ok:true,ms:Math.round(performance.now()-began)});}catch(error){report.checks.push({name,ok:false,error:error.message});}document.getElementById('report').textContent=JSON.stringify(report,null,2);}
 let original=await render(C.create(source));
 await check('Ảnh gốc, kích thước và alpha',async()=>{assert(original.w===128&&original.h===96,'Wrong size');assert(eq(pixel(original,20,20),[40,40,40,255]),'Wrong original pixel');assert(pixel(original,120,10)[3]===128,'Alpha lost');});
 await check('Cắt đúng tọa độ',async()=>{const doc=C.create(source);C.transform(doc,'crop',{x:20,y:10,width:80,height:60});const im=await render(doc);assert(im.w===80&&im.h===60,'Crop size');assert(eq(pixel(im,5,5),pixel(original,25,15)),'Crop pixel mapping');});
 await check('Xoay đúng tọa độ',async()=>{const doc=C.create(source);C.transform(doc,'rotate',90);const im=await render(doc);assert(im.w===96&&im.h===128,'Rotate size');assert(eq(pixel(im,95-20,30),pixel(original,30,20)),'Rotate mapping');});
 await check('Vùng đã cắt không xuất hiện lại khi xoay nghiêng',async()=>{const doc=C.create(source);C.transform(doc,'crop',{x:40,y:30,width:40,height:30});C.transform(doc,'rotate',45);const im=await render(doc);assert(pixel(im,0,0)[3]===0&&pixel(im,im.w-1,0)[3]===0,'Cropped pixels leaked into corners');});
 await check('Đổi kích thước giữ alpha',async()=>{const doc=C.create(source);C.transform(doc,'resize',{width:256,height:192});const im=await render(doc);assert(im.w===256&&im.h===192,'Resize failed');assert(pixel(im,240,40)[3]===128,'Resize alpha');});
 await check('Chỉnh màu thay RGB và giữ alpha',async()=>{const doc=C.create(source);doc.adjustments.brightness=25;doc.adjustments.temperature=10;const im=await render(doc);assert(pixel(im,40,40)[0]>pixel(original,40,40)[0],'No change');for(let i=3;i<im.data.length;i+=4)assert(im.data[i]===original.data[i],'Alpha changed');});
 await check('Cọ tô chỉ đổi vùng nét vẽ',async()=>{const doc=C.create(source);doc.strokes.push(stroke('paint'));const im=await render(doc);assert(eq(pixel(im,48,48),[255,0,0,255]),'Brush center');assert(eq(pixel(im,20,20),pixel(original,20,20)),'Changed outside brush');});
 await check('Nét dài liên tục qua nhiều điểm kéo',async()=>{const doc=C.create(source);doc.strokes.push(stroke('paint',{size:8,points:[{x:10,y:20},{x:15,y:20},{x:30,y:20},{x:80,y:20}]}));const im=await render(doc);for(let x=10;x<=80;x++)assert(eq(pixel(im,x,20),[255,0,0,255]),'Gap in stroke at '+x);assert(eq(pixel(im,40,30),pixel(original,40,30)),'Stroke leaked');});
 await check('Vùng chọn cộng/trừ giới hạn nét cọ',async()=>{const doc=C.create(source);doc.strokes.push(stroke('paint',{size:70,selection:{feather:0,shapes:[{type:'rect',mode:'replace',points:[{x:30,y:30},{x:70,y:70}]},{type:'ellipse',mode:'subtract',points:[{x:40,y:40},{x:56,y:56}]}]}}));const im=await render(doc);assert(eq(pixel(im,35,35),[255,0,0,255]),'Selection not applied');assert(eq(pixel(im,48,48),pixel(original,48,48)),'Subtracted area changed');assert(eq(pixel(im,20,48),pixel(original,20,48)),'Outside selection changed');});
 await check('Đa giác và làm mềm mép',async()=>{const doc=C.create(source);doc.strokes.push(stroke('paint',{size:100,selection:{feather:4,shapes:[{type:'polygon',mode:'replace',points:[{x:30,y:30},{x:70,y:30},{x:50,y:70}]}]}}));const im=await render(doc);assert(pixel(im,50,40)[0]>240,'Polygon center');assert(pixel(im,30,30)[0]<255,'Feather absent');assert(eq(pixel(im,10,10),pixel(original,10,10)),'Far pixel changed');});
 await check('Sao chép đúng điểm mẫu',async()=>{const doc=C.create(source);doc.strokes.push(stroke('clone',{anchor:{x:20,y:20}}));const im=await render(doc);assert(eq(pixel(im,48,48),pixel(original,20,20)),'Wrong clone source');});
 await check('Vá điểm mẫu không đổi ngoài nét',async()=>{const doc=C.create(source);doc.strokes.push(stroke('heal',{anchor:{x:20,y:20}}));const im=await render(doc);assert(eq(pixel(im,10,10),pixel(original,10,10)),'Heal leaked');assert(pixel(im,48,48)[3]===255,'Heal alpha');});
 await check('Khôi phục từ ảnh gốc và hoàn tác cache',async()=>{const doc=C.create(source);doc.strokes.push(stroke('paint'));await render(doc);doc.strokes.push(stroke('restore'));const restored=await render(doc);assert(eq(pixel(restored,48,48),pixel(original,48,48)),'Restore failed');doc.strokes=[];const undo=await render(doc);assert(eq(Array.from(undo.data),Array.from(original.data)),'Worker retained undone paint');});
 await check('Xóa trong suốt',async()=>{const doc=C.create(source);doc.strokes.push(stroke('erase'));const im=await render(doc);assert(pixel(im,48,48)[3]===0,'Erase alpha');assert(eq(pixel(im,10,10),pixel(original,10,10)),'Erase leaked');});
 for(const tool of ['dodge','burn','blur','sharpen'])await check('Cọ '+tool,async()=>{const doc=C.create(source);doc.strokes.push(stroke(tool));const im=await render(doc);assert(!eq(pixel(im,48,48),pixel(original,48,48)),tool+' no effect');assert(eq(pixel(im,10,10),pixel(original,10,10)),tool+' leaked');});
 await check('Lớp ảnh, độ hiện và vùng che',async()=>{const doc=C.create(source);doc.layers.push({id:'logo',type:'image',url:logo,name:'Logo',x:20,y:20,width:24,height:24,rotation:0,opacity:1,visible:true,mask:[]});const im=await render(doc);assert(eq(pixel(im,30,30),[250,20,20,255]),'Layer image');doc.layers[0].mask.push(stroke('erase',{points:[{x:10,y:10}],size:12}));const masked=await render(doc);assert(eq(pixel(masked,30,30),pixel(original,30,30)),'Layer mask');doc.layers[0].visible=false;const hidden=await render(doc);assert(eq(pixel(hidden,30,30),pixel(original,30,30)),'Layer visibility');});
 await check('Lớp chữ và xem trước chỉnh sửa',async()=>{const doc=C.create(source);doc.layers.push({id:'t',type:'text',name:'Text',text:'AI',fontSize:24,color:'#ffffff',bold:true,x:20,y:20,width:60,height:40,rotation:0,opacity:1,visible:true,mask:[]});const im=await render(doc);assert(!eq(Array.from(im.data),Array.from(original.data)),'Text missing');const before=await render(doc,{before:true});assert(eq(Array.from(before.data),Array.from(original.data)),'Before includes edits');});
 for(const format of ['image/png','image/jpeg','image/webp'])await check('Xuất '+format,async()=>{const doc=C.create(source),{blob}=await call(doc,'export',{format,quality:.95});assert(blob.type===format,'Format fallback');const bitmap=await createImageBitmap(blob);assert(bitmap.width===128&&bitmap.height===96,'Export size');const c=new OffscreenCanvas(128,96),ctx=c.getContext('2d');ctx.drawImage(bitmap,0,0);bitmap.close();const alpha=ctx.getImageData(120,10,1,1).data[3];assert(alpha===(format==='image/jpeg'?255:128),'Export alpha');});

 const selection={feather:0,shapes:[{type:'rect',mode:'replace',points:[{x:30,y:30},{x:70,y:70}]}]};
 let raster='';
 await check('Lưu vùng dạng ảnh để chia sẻ',async()=>{const d=C.create(source);d.selection=selection;const {blob}=await call(d,'mask');const data=await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(blob);});const response=await fetch('/api/manual/assets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data,name:'workflow-mask-fixture'})}),r=await response.json();assert(r.ok,r.error);raster=r.asset.url;});
 await check('Lớp điều chỉnh chỉ thay đổi vùng, giữ alpha và bỏ qua lớp ẩn',async()=>{const d=C.create(source);d.layers=[{id:'a',type:'adjustment',visible:true,opacity:.5,selection,adjustments:{...C.defaults(),brightness:30}}];let im=await render(d);assert(pixel(im,40,40)[0]>pixel(original,40,40)[0],'Region unchanged');assert(eq(pixel(im,20,20),pixel(original,20,20)),'Outside changed');for(let i=3;i<im.data.length;i+=4)assert(im.data[i]===original.data[i],'Alpha changed');d.layers[0].visible=false;assert(eq(Array.from((await render(d)).data),Array.from(original.data)),'Hidden adjustment applied');});
 await check('Vùng raster và vùng vector cho kết quả giống nhau',async()=>{const d=C.create(source);d.strokes=[stroke('paint',{size:90,selection})];const a=await render(d);d.strokes[0].selection={shapes:[],feather:0,maskUrl:raster};const b=await render(d);assert(eq(Array.from(a.data),Array.from(b.data)),'Raster selection mismatch');});
 await check('Chuyển vùng chọn qua cắt/xoay',async()=>{const d=C.create(source);d.selection=selection;C.transform(d,'crop',{x:20,y:20,width:80,height:60});C.transform(d,'rotate',90);const {blob}=await call(d,'mask',{outputSpace:true}),im=await createImageBitmap(blob);assert(im.width===60&&im.height===80,'Wrong mask space');im.close();});
 const background=()=>({maskUrl:raster,mode:'transparent',color:'#ffffff',feather:0,threshold:0,strokes:[],shadow:{opacity:0,blur:0,x:10,y:10}});
 await check('Tách chủ thể giữ pixel bên trong, xóa nền',async()=>{const d=C.create(source);d.background=background();const im=await render(d);assert(eq(pixel(im,40,40),pixel(original,40,40)),'Subject changed');assert(pixel(im,20,20)[3]===0,'Background remains');});
 await check('Nền màu và nền ảnh phủ đúng khung',async()=>{const d=C.create(source);d.background={...background(),mode:'color',color:'#00ff00'};assert(eq(pixel(await render(d),20,20),[0,255,0,255]),'Color background');d.background={...background(),mode:'image',url:logo};assert(eq(pixel(await render(d),20,20),[250,20,20,255]),'Image background');});
 await check('Cọ sửa mép có thể thêm và bỏ chủ thể',async()=>{const d=C.create(source);d.background=background();d.background.strokes=[stroke('erase')];assert(pixel(await render(d),48,48)[3]===0,'Erase matte');d.background.strokes=[stroke('paint',{points:[{x:20,y:20}],color:'#ffffff'})];assert(eq(pixel(await render(d),20,20),pixel(original,20,20)),'Add matte');});
 await check('Làm mềm mép và bóng giữ vùng xa trong suốt',async()=>{const d=C.create(source);d.background=background();d.background.feather=2;let im=await render(d);assert(pixel(im,30,40)[3]>0&&pixel(im,30,40)[3]<255,'No feather');d.background.feather=0;d.background.shadow.opacity=.5;im=await render(d);assert(pixel(im,75,75)[3]>0,'Missing shadow');assert(pixel(im,5,5)[3]===0,'Shadow leaked far');});
 await check('Xuất theo mẫu giữ toàn ảnh, cắt đầy và logo',async()=>{const d=C.create(source);async function out(spec){const {blob}=await call(d,'export',{spec});const im=await createImageBitmap(blob),c=new OffscreenCanvas(im.width,im.height),ctx=c.getContext('2d');ctx.drawImage(im,0,0);im.close();return {w:c.width,h:c.height,data:ctx.getImageData(0,0,c.width,c.height).data};}let im=await out({width:200,height:200,fit:'contain'});assert(im.w===200&&pixel(im,100,5)[3]===0,'Contain margins');im=await out({width:200,height:200,fit:'cover'});assert(pixel(im,100,5)[3]>0,'Cover margins');im=await out({width:200,height:200,logoUrl:logo,logoScale:10,logoOpacity:1,logoPosition:'top-left',margin:5});assert(eq(pixel(im,10,10),[250,20,20,255]),'Logo misplaced');im=await out({width:120,height:120,logoUrl:logo,logoScale:100,logoOpacity:1,margin:24});assert(eq(pixel(im,119,119),[250,20,20,255]),'Full-size logo clipped');});
 await check('Ảnh 16 triệu pixel: xem và xuất PNG',async()=>{const doc=C.create({url:'/manual-assets/9cc2c9c054b5cbafd4c8fd340ca6c187369478eece5aa9e4fd63e006ec7fbccb.png',width:4096,height:4096,name:'large'});doc.adjustments.contrast=10;const {bitmap}=await call(doc);assert(bitmap.width===4096,'Large preview');bitmap.close();const {blob}=await call(doc,'export',{format:'image/png'});assert(blob.size>0,'Large export');});
 report.elapsedMs=Math.round(performance.now()-start);report.passed=report.checks.filter(t=>t.ok).length;report.total=report.checks.length;document.getElementById('report').textContent=JSON.stringify(report,null,2);document.getElementById('run').disabled=false;
};
</script></html>
